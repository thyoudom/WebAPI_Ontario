<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner Slides</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.bootstrap5.css">
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
​    <style>
        .creareby{
            display: none;
        }
        .tableID{
            width: 5%;
            text-align: center;
        }
        .tabltitle{
            width: 20%;
        }
        .tabledes{
            width: 30%;
        }
        .tableimage{
            width: 5%;
            text-align: center;
        }
         .tablestatus{
            width: 5%;
            text-align: center;
        }
         .tableimage{
            width: 10%;
            text-align: center;
        }
        .tableaction{
            width: 20%;
            text-align: center;
        }
        .battambang-thin {
            font-family: "Battambang", system-ui;
            font-weight: 100;
            font-style: normal;
        }

        .battambang-light {
            font-family: "Battambang", system-ui;
            font-weight: 300;
            font-style: normal;
        }

        .battambang-regular {
            font-family: "Battambang", system-ui;
            font-weight: 400;
            font-style: normal;
        }

        .battambang-bold {
            font-family: "Battambang", system-ui;
            font-weight: 700;
            font-style: normal;
        }

        .battambang-black {
            font-family: "Battambang", system-ui;
            font-weight: 900;
            font-style: normal;
        }
        .panel-container {
  /* Set a fixed height for the entire panel */
  height: 100vh;
  width: 100%;
  border: 1px solid #ffffff;
  display: flex; /* Use flexbox for a flexible layout */
  flex-direction: column; /* Stack the header and body vertically */
}

.panel-header {
  position: sticky; /* Sticky is often a better choice for panels */
  top: 0;
  background-color: #f0f0f0;
  padding: 15px;
  border-bottom: 1px solid #ccc;
}

.panel-body {
  flex-grow: 1; /* Allow the body to take up the remaining space */
  overflow-y: auto; /* Enable vertical scrolling */
  padding: 15px;
}
    </style>
</head>
<body>
    <div class="card">
  <div class="card-header sticky-top">
   <div class="row display-fix row align-items-center bg-light">
        <div class="col-md-8" style="vertical-align: baseline;margin: auto;">
            <h3 class="battambang-black">School Facilities</h3>
        </div>
        <div class="col-md-4" style="margin-top: 10px;">
            <button type="button" class="btn btn-primary mb-3 float-end" data-bs-toggle="modal" data-bs-target="#bannerModal" id="addBannerBtn" onclick="Cleardata(this)" style="vertical-align: baseline;margin: auto;">
                <i class="bi bi-plus-circle-fill"></i>  Add New Facilities
            </button>
        </div>
    </div>
  </div>
  <div class="scrollable-body">
    <div class="card-body">
      <table id="bannerTable" class="table table-striped table-bordered" style="width:100%">
        <thead>
            <tr>
                <th class="battambang-bold tableID ">ID</th>
                <th class="battambang-bold tabltitle ">Title</th>
                <th class="battambang-bold tabledes ">Description</th>
                <th class="battambang-bold tableimage ">Image</th>
                <th class="battambang-bold tablestatus">Status</th>
                <th class="battambang-bold creareby">Created By</th>
                <th class="battambang-bold createdate">Create Date</th>
                <th class="battambang-bold updatedate">Update Date</th>
                <th class="battambang-bold tableaction">Actions</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>
    </div>
  </div>
</div>


<div class="modal fade" id="bannerModal" tabindex="-1" aria-labelledby="bannerModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header display-fix">
                <h5 class="modal-title" id="bannerModalLabel">Add Banner</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="bannerForm">
                    <input type="hidden" id="banner_id" name="id">
                    <div class="mb-3">
                        <label for="title" class="form-label">Title</label>
                        <input type="text" class="form-control battambang-regular" id="title" name="title" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <div id="editor" class="battambang-regular" style="height: 200px;"></div>
                        <input type="hidden" id="description" name="description" >
                    </div>
                    
                    <div class="mb-3" id="ActiveClass">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-select" id="status" name="status" required>
                            <option value="Active">Draft</option>
                            <option value="Active">Published</option>
                            <option value="Inactive">Archived</option>
                        </select>
                    </div>
                    <div class="mb-3" id="createby">
                        <label for="create_by" class="form-label ">Created By</label>
                        <input type="text" class="form-control" id="create_by" name="create_by" required>
                    </div>
                    <div class="mb-3" id="createdate">
                        <label for="create_date" class="form-label">Create Date</label>
                        <input type="datetime-local" class="form-control" id="create_date" name="create_date" readonly>
                    </div>
                    <div class="mb-3" id="updatedate">
                        <label for="update_date" class="form-label">Update Date</label>
                        <input type="datetime-local" class="form-control" id="update_date" name="update_date " readonly>
                    </div>
                    <div class="mb-3">
                        <label for="image_file" class="form-label">Image File</label>
                        <input type="file" class="form-control battambang-regular​" onchange="readURL(this);" id="image_file" name="image_file" accept="image/*">
                        <div id="current_image_preview" class="mt-2" style="display: none;">
                            <p>Current Image:</p>
                            <img id="image_preview_img" src="" alt="Current Image" style="max-width: 100px;">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal"><i class="bi bi-x-circle-fill"></i> Close</button>
                <button type="submit" class="btn btn-primary" form="bannerForm" id="saveBtn"> <i class="bi bi-plus-circle-fill"></i> Save changes</button>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/2.0.8/js/dataTables.js"></script>
<script src="https://cdn.datatables.net/2.0.8/js/dataTables.bootstrap5.js"></script>
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
<script src="script/function/facilities.js"></script>
</body>
</html>
