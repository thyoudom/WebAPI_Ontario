<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap 5.3.3 Custom Modal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Custom CSS for a unique look */
    .modal-content {
      border-radius: 15px; /* Rounded corners for a modern feel */
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3); /* A more pronounced shadow */
    }
    .modal-header {
      background-color: #f8f9fa; /* Light gray header */
      border-bottom: 1px solid #dee2e6;
    }
    .modal-footer {
      background-color: #f8f9fa; /* Light gray footer */
    }
    .modal-custom-width {
  --bs-modal-width: 900px; /* Use CSS variables for a modern approach */
}
  </style>
</head>
<body>
<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#customModal">
  Launch Custom Modal
</button>

<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#myCustomModal">
  Launch custom-sized modal
</button>

<div class="modal fade" id="myCustomModal" tabindex="-1" aria-labelledby="myCustomModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-custom-width">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="myCustomModalLabel">Custom-Sized Modal</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        This modal has a custom width.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary">Save changes</button>
      </div>
    </div>
  </div>
</div>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
  <script>
    const myModalEl = document.getElementById('customModal');
myModalEl.addEventListener('show.bs.modal', function (event) {
  // Do something when the modal is about to be shown
  console.log('The modal is about to be shown!');
});

myModalEl.addEventListener('hidden.bs.modal', function (event) {
  // Do something when the modal is completely hidden
  console.log('The modal is now hidden!');
});
  </script>
</body>
</html>
