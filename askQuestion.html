<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Data with Bootstrap 5.3.3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        .ql-editor { min-height: 150px; }
    </style>
</head>
<body>

<div class="container my-5">
    <h1 class="mb-4">Data Management CRUD (BS 5.3.3)</h1>
    
    <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#crudModal" id="addNewBtn">
        + Add New Record
    </button>

    <div class="table-responsive">
        <table id="dataTable" class="table table-striped table-hover" style="width:100%">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Description (EN)</th>
                    <th>Status</th>
                    <th>Image</th>
                    <th>Created By</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="crudModal" tabindex="-1" aria-labelledby="crudModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form id="crudForm" enctype="multipart/form-data">
                <div class="modal-header">
                    <h5 class="modal-title" id="crudModalLabel">Create New Record</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="action" id="action" value="create">
                    <input type="hidden" name="id" id="dataId">
                    <input type="hidden" name="current_image" id="currentImage"> <div class="mb-3">
                        <label class="form-label">Description (English)</label>
                        <div id="description_EN_editor"></div>
                        <textarea name="description_EN" id="description_EN_input" style="display:none;"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description (Khmer)</label>
                        <div id="description_KH_editor"></div>
                        <textarea name="description_KH" id="description_KH_input" style="display:none;"></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status" name="status" required>
                                <option value="Active">Active</option>
                                <option value="Inactive">Inactive</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="images" class="form-label">Image</label>
                            <input class="form-control" type="file" id="images" name="images" accept="image/*">
                            <div id="imagePreview" class="mt-2"></div>
                        </div>
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">Save Record</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

<script src="script/function/askAnd_Question.js"></script>

</body>
</html>
