<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Bootstrap Cards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-img-top {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .container {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="my-4 text-center">API Data Cards</h1>
        <div id="cardContainer" class="row">
            </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        $(document).ready(function() {
            const api_url = 'https://api.ontario.edu.kh/curriculumReadData.php';
            function fetchData() {
                $.ajax({
                    url: api_url,
                    type: 'GET',
                    dataType: 'json',
                    success: function(data) {
                        $('#cardContainer').empty();
                        if (Array.isArray(data) && data.length > 0) {
                            $.each(data, function(index, item) {
                                const cardHtml = `
                                    <div class="col-md-4 mb-4">
                                        <div class="card h-100">
                                            <img src="https://api.ontario.edu.kh/${item.image_file}" class="card-img-top" alt="${item.title}">
                                            <hr>
                                            <div class="card-body">
                                                <h5 class="card-title">${item.title}</h5>
                                                <p class="card-text">${item.description}</p>
                                                <p class="card-text text-muted">ID: ${item.id}</p>
                                            </div>
                                        </div>
                                    </div>
                                `;
                                $('#cardContainer').append(cardHtml);
                            });
                        } else {
                            $('#cardContainer').html('<p class="text-center">No data available.</p>');
                        }
                    },
                    error: function(xhr, status, error) {
                        console.error('API fetch failed:', status, error);
                        $('#cardContainer').html('<p class="text-center text-danger">Failed to load data. Please try again later.</p>');
                    }
                });
            }
            fetchData();
        });
    </script>
</body>
</html>
