<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quill Editor with cPanel API</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>

    <h1>Displaying Description from cPanel API</h1>

    <div id="editor-container"></div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {

    // Initialize Quill editor
    const quill = new Quill('#editor-container', {
        theme: 'snow',
        readOnly: true // Set to readOnly as we are only displaying text
    });

    try {
        // Fetch data from your server-side endpoint
        const response = await fetch('https://api.ontario.edu.kh/curriculum.php?action=read');

        if (!response.ok) {
            throw new Error('Network response was not ok');
        }

        const data = await response.json();

        // Assuming your API returns a "description" field
        const description = data.description;
        console.log(data)
        const editor=document.getElementById('editor-container');
        editor.innerHTML=`[
            <p>${data.description} </p>
        ]`;
        if (description) {
            // Set the fetched content into the Quill editor
            quill.clipboard.dangerouslyPasteHTML(description);
        }

    } catch (error) {
        console.error('Error fetching data:', error);
        // Display an error message to the user
        quill.clipboard.dangerouslyPasteHTML('<p>Failed to load description. Please try again later.</p>');
    }
});
    </script>

</body>
</html>
