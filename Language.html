<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Switcher Example</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.3.2/css/flag-icons.min.css" />
  <style>
    .flag-icon {
      width: 20px;
      height: 15px;
      margin-right: 5px;
      vertical-align: middle;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">My Website</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#" data-translate="home">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-translate="about">About Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-translate="contact">Contact</a>
        </li>
      </ul>
      <div class="d-flex">
        <div class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="languageDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <span id="currentFlag" alt="English Flag"></span>
            <span id="currentLang">EN</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="languageDropdown">
            <li>
              <a class="dropdown-item" href="#" data-lang="en">
                <span class="fi fi-sh"></span> EN
              </a>
            </li>
            <li>
              <a class="dropdown-item" href="#" data-lang="kh">
                <span class="fi fi-kh"></span> KH
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <h1 data-translate="main_title">Welcome to Our Website</h1>
  <p data-translate="main_text">This is an example of a language switcher using Bootstrap 5.3.3 and JavaScript to translate content from an API.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const translations = {
    'en': {
      'home': 'Home',
      'about': 'About Us',
      'contact': 'Contact',
      'main_title': 'Welcome to Our Website',
      'main_text': 'This is an example of a language switcher using Bootstrap 5.3.3 and JavaScript to translate content from an API.',
      'flag': '<span class="fi fi-sh"></span>'
    },
    'kh': {
      'home': 'ទំព័រដើម',
      'about': 'អំពីយើង',
      'contact': 'ទំនាក់ទំនង',
      'main_title': 'សូមស្វាគមន៍មកកាន់គេហទំព័ររបស់យើង',
      'main_text': 'នេះជាឧទាហរណ៍នៃការប្តូរភាសាដោយប្រើ Bootstrap 5.3.3 និង JavaScript ដើម្បីបកប្រែខ្លឹមសារពី API។',
      'flag': '<span class="fi fi-kh"></span>'
    }
  };

  document.querySelectorAll('.dropdown-item').forEach(item => {
    const currentFlag=document.getElementById('currentFlag')
    currentFlag.innerHTML=`<span class="fi fi-sh"></span>`;
    
    item.addEventListener('click', event => {
      event.preventDefault();
      const lang = event.target.closest('.dropdown-item').dataset.lang;
      switchLanguage(lang);
    });
  });

  function switchLanguage(lang) {
    const data = translations[lang]; // Simulate fetching from API
    
    // Update the dropdown button's flag and text
    document.getElementById('currentLang').textContent = lang.toUpperCase();
    document.getElementById('currentFlag').innerHTML = data.flag;

    // Update all translatable elements on the page
    document.querySelectorAll('[data-translate]').forEach(el => {
      const key = el.getAttribute('data-translate');
      if (data[key]) {
        el.textContent = data[key];
      }
    });

    // Update the main page language attribute for better accessibility
    document.documentElement.lang = lang;
  }
</script>
</body>
</html>
