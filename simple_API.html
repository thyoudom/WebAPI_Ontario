<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple CRUD App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Battambang:wght@100;300;400;700;900&family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&family=Khmer&display=swap"
        rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            margin-top: 50px;
        }

        .table-image {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 5px;
        }

        .modal-body .form-control-file {
            width: 100%;
        }

        .battambang-thin {
            font-family: "Battambang", system-ui;
            font-weight: 100;
            font-style: normal;
        }

        .battambang-light {
            font-family: "Battambang", system-ui;
            font-weight: 300;
            font-style: normal;
        }

        .battambang-regular {
            font-family: "Battambang", system-ui;
            font-weight: 400;
            font-style: normal;
        }

        .battambang-bold {
            font-family: "Battambang", system-ui;
            font-weight: 700;
            font-style: normal;
        }

        .battambang-black {
            font-family: "Battambang", system-ui;
            font-weight: 900;
            font-style: normal;
        }

        .viewImage-container {
            width: 200px;
        }

        .tableid {
            width: 50px;
            text-align: center;
        }

        .tablegender {
            width: 100px;
            text-align: center;
        }

        .tableimage {
            width: 100px;
            text-align: center;
        }

        .tableaction {
            width: 300px;
            text-align: center;
        }

        .tdbodyid {
            width: 50px;
            text-align: center;
        }

        .tdbodygender {
            width: 100px;
            text-align: center;
        }

        .tdbodyimage {
            width: 100px;
            text-align: center;
        }

        .tdbodyaction {
            width: 300px;
            text-align: center;
        }

        iframe {
            scrollbar-width: none;
        }
        .card-header{
            background-color: #1f1fff;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="card-header">
            <input type="text" class="form-control" id="searchInput" placeholder="Search by title..."
                style="width: 20%;float: left;">
            <button type="button" id="add-record-btn" class="btn btn-success" style="float: right;"><i
                    class="bi bi-plus-circle"></i>Add New Record</button>
        </div>
        <div class="card-body">
            <h5 class="card-title"></h5>
            <div class="container-flud">


                <table class="table table-striped table-bordered">
                    <thead class="table-info">
                        <tr>
                            <th class="tableid">ID</th>
                            <th class="battambang-regular tablename">Name</th>
                            <th class="tablegender">Gender</th>
                            <th class="tableimage">Image</th>
                            <th class="tableaction">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="data-table-body">
                        <!-- Data will be loaded here via JavaScript -->
                    </tbody>
                </table>
                <nav aria-label="Page navigation">
                    <ul class="pagination justify-content-center" id="pagination">
                    </ul>
                </nav>
            </div>
        </div>
    </div>



    <!-- Data Modal (Add/Edit Form) -->
    <div class="modal fade" id="data-modal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalLabel">Add New Record</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="data-form">
                        <input type="hidden" id="record-id">
                        <input type="hidden" id="old-image-file">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="gender" class="form-label">Gender</label>
                            <select class="form-select" id="gender" required>
                                <option value="" disabled selected>Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="image-file" class="form-label">Image File</label>
                            <input class="form-control" onchange="readURL(this);" type="file" id="image-file"
                                accept="image/*">
                        </div>
                        <div class="row g-3">
                            <div class="col">
                                <img id="viewImage" class="viewImage-container" src="" alt="View image On datase" />
                            </div>
                            <div class="col">
                                <img id="imagePreview" class="viewImage-container" src="" alt="Selected Image" />
                            </div>
                        </div>
                        <hr>
                        <br>
                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary" id="btnsubmit">Save Record</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div class="modal fade" id="confirm-modal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmModalLabel">Confirm Deletion</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete this record?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirm-delete-btn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Message Modal -->
    <div class="modal fade" id="message-modal" tabindex="-1" aria-labelledby="messageModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="messageModalLabel">Message</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="message-body">
                    <!-- Message content here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'https://api.ontario.edu.kh/SliderAPI.php'; // IMPORTANT: Change this if your file is in a different location.
        const fileInput = document.getElementById('image-file');
        const btnsubmit = document.getElementById('btnsubmit')
        // Get DOM elements
         const preview = document.getElementById('imagePreview'); // An <img> tag for preview
        const dataTableBody = document.getElementById('data-table-body');
        const addRecordBtn = document.getElementById('add-record-btn');
        const dataModal = new bootstrap.Modal(document.getElementById('data-modal'));
        const confirmModal = new bootstrap.Modal(document.getElementById('confirm-modal'));
        const messageModal = new bootstrap.Modal(document.getElementById('message-modal'));
        const modalLabel = document.getElementById('modalLabel');
        const dataForm = document.getElementById('data-form');
        const recordId = document.getElementById('record-id');
        const oldImageFile = document.getElementById('old-image-file');
        const viewImage = document.getElementById('viewImage');
        const nameInput = document.getElementById('name');
        const genderInput = document.getElementById('gender');
        const imageFileInput = document.getElementById('image-file');
        const confirmDeleteBtn = document.getElementById('confirm-delete-btn');
        const messageBody = document.getElementById('message-body');
        const paginationContainer = document.getElementById('pagination');
        const searchInput = document.getElementById('searchInput');

        // Function to show the message modal
        function showMessage(message) {
            messageBody.textContent = message;
            messageModal.show();
        }
        const ROWS_PER_PAGE = 10;
        let data = [];
        let currentPage = 1;
        let filteredData = [];
        const fetchData = async () => {
            try {
                const response = await fetch(API_URL);
                data = await response.json();
                filteredData = data;
                renderTable();
                renderPagination();
            } catch (error) {
                console.error('Error fetching data:', error);
                dataTableBody.innerHTML = '<tr><td colspan="3" class="text-danger text-center">Failed to load data.</td></tr>';
            }
        };
        const renderTable = () => {
            dataTableBody.innerHTML = ''; // Clear previous rows
            const start = (currentPage - 1) * ROWS_PER_PAGE;
            const end = start + ROWS_PER_PAGE;
            const pageData = filteredData.slice(start, end);

            pageData.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                <td class="tdbodyid">${item.id}</td>
                <td class="battambang-regular">${item.name}</td>
                <td class="tdbodygender">${item.gender}</td>
                <td class="tdbodyimage">
                    <img src='https://api.ontario.edu.kh/Images/${item.image_file}' alt="Image of ${item.name}" data-image-path="${item.name}" class="table-image" onerror="this.onerror=null; this.src='';">
                </td>
                <td class="tdbodyaction">
                    <button class="btn btn-sm btn-warning edit-btn" data-id="${item.id}" data-name="${item.name}" data-gender="${item.gender}" data-image="${item.image_file}">
                        <i class="bi bi-pencil-square"></i> Edit
                    </button>
                    <button class="btn btn-sm btn-danger delete-btn" data-id="${item.id}" data-image="${item.image_file}">
                        <i class="bi bi-trash"></i> Delete
                    </button>
                </td>
            `;
                dataTableBody.appendChild(row);
            });
        };
        // Fetch and display records from the API

        // Handle form submission (Add or Edit)
        dataForm.addEventListener('submit', async (e) => {
            btnsubmit.disabled = true;
            btnsubmit.innerHTML = '<span class="spinner-grow spinner-grow-sm" aria-hidden="true"></span><span role="status">Loading...</span>';
            e.preventDefault();
            const isEdit = recordId.value !== '';
            const formData = new FormData();

            formData.append('name', nameInput.value);
            formData.append('gender', genderInput.value);

            // Append file if selected
            if (imageFileInput.files.length > 0) {
                formData.append('image_file', imageFileInput.files[0]);
            }
            let url = API_URL;
            let method = 'POST';

            if (isEdit) {
                // For editing, we use POST and a hidden field to simulate PUT
                formData.append('id', recordId.value);
                formData.append('_method', 'PUT');
                formData.append('old_image_file', oldImageFile.value);
            }

            try {
                const response = await fetch(url, {
                    method: method,
                    body: formData
                });

                if (!response.ok) throw new Error('Network response was not ok');
                const result = await response.json();

                if (result.success) {
                    showMessage(result.message);
                    dataModal.hide();
                    dataForm.reset();
                    fetchData();; // Refresh the table
                    btnsubmit.innerHTML = 'Add New';
                    viewImage.src = '';
                    btnsubmit.disabled = false;
                    clear();
                } else {
                    showMessage('Error: ' + result.message);
                }
            } catch (error) {
                console.error('Form submission error:', error);
                showMessage('An error occurred during form submission.');
            }
        });

        // Event listener for opening the 'Add' modal
        addRecordBtn.addEventListener('click', () => {
            dataForm.reset();
            preview.src = 'https://w7.pngwing.com/pngs/819/548/png-transparent-photo-image-landscape-icon-images-thumbnail.png'
            recordId.value = '';
            viewImage.style.display='none';
            oldImageFile.value = '';
            modalLabel.textContent = 'Add New Record';
            imageFileInput.required = true; // Image is required for new records
            dataModal.show();
        });

        // Event listener for edit and delete buttons
        dataTableBody.addEventListener('click', (e) => {
            if (e.target.closest('.edit-btn')) {
               
                preview.style.display='none';
                const btn = e.target.closest('.edit-btn');
                recordId.value = btn.dataset.id;
                nameInput.value = btn.dataset.name;
                genderInput.value = btn.dataset.gender;
                oldImageFile.value = btn.dataset.image;
                viewImage.src = 'https://api.ontario.edu.kh/Images/' + btn.dataset.image;
                modalLabel.textContent = 'Edit Record';
                imageFileInput.required = false; // Image is not required for edits
                dataModal.show();
            }

            if (e.target.closest('.delete-btn')) {
                const btn = e.target.closest('.delete-btn');
                const recordToDeleteId = btn.dataset.id;
                const imageToDelete = btn.dataset.image;

                // Show confirmation modal
                confirmModal.show();

                // Add a one-time listener for the delete confirmation button
                confirmDeleteBtn.onclick = async () => {
                    try {
                        const response = await fetch(API_URL, {
                            method: 'DELETE',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ id: recordToDeleteId, image_file: imageToDelete })
                        });
                        console.log(recordToDeleteId)
                        if (!response.ok) throw new Error('Network response was not ok');
                        const result = await response.json();

                        if (result.success) {
                            showMessage(result.message);
                            confirmModal.hide();
                            fetchData();; // Refresh the table
                        } else {
                            showMessage('Error: ' + result.message);
                        }
                    } catch (error) {
                        console.error('Delete error:', error);
                        showMessage('An error occurred during deletion.');
                    }
                };
            }
        });
        function clear() {
            recordId.value = '';
            oldImageFile.value = '';
            preview.src='';
            viewImage.src = 'https://w7.pngwing.com/pngs/819/548/png-transparent-photo-image-landscape-icon-images-thumbnail.png'
        }
        // Initial fetch
        // Creates and renders pagination buttons
        const renderPagination = () => {
            paginationContainer.innerHTML = ''; // Clear previous pagination
            const totalPages = Math.ceil(filteredData.length / ROWS_PER_PAGE);

            // Previous button
            const prevLi = createPaginationItem('Previous', currentPage > 1, () => {
                currentPage--;
                renderTable();
                renderPagination();
            });
            paginationContainer.appendChild(prevLi);

            // Page number buttons
            for (let i = 1; i <= totalPages; i++) {
                const pageLi = createPaginationItem(i, true, () => {
                    currentPage = i;
                    renderTable();
                    renderPagination();
                });
                if (i === currentPage) {
                    pageLi.classList.add('active');
                }
                paginationContainer.appendChild(pageLi);
            }

            // Next button
            const nextLi = createPaginationItem('Next', currentPage < totalPages, () => {
                currentPage++;
                renderTable();
                renderPagination();
            });
            paginationContainer.appendChild(nextLi);
        };

        // Helper function to create a single pagination list item
        const createPaginationItem = (text, isEnabled, onClick) => {
            const li = document.createElement('li');
            li.className = 'page-item' + (!isEnabled ? ' disabled' : '');
            const a = document.createElement('a');
            a.className = 'page-link';
            a.href = '#';
            a.textContent = text;
            if (isEnabled) {
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    onClick();
                });
            }
            li.appendChild(a);
            return li;
        };

        // Live search functionality
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            filteredData = data.filter(item =>
                item.name.toLowerCase().includes(searchTerm) ||
                item.gender.toLowerCase().includes(searchTerm)
            );
            currentPage = 1; // Reset to first page after search
            renderTable();
            renderPagination();
        });
        function readURL() {
            const preview = document.getElementById('imagePreview'); // An <img> tag for preview
            const file = document.querySelector('input[type=file]').files[0]; // The selected file
            const reader = new FileReader();

            reader.addEventListener("load", function () {
                // Convert file to base64 string and set as src
                preview.src = reader.result;
                preview.style.display='block';
            }, false);

            if (file) {
                reader.readAsDataURL(file); // Read the file as a data URL
            }
        }
        function clearData(){

        }
        fetchData();
    </script>
</body>

</html>
