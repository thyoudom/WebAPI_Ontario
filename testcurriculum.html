<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Management</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.bootstrap5.css">
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <link href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" rel="stylesheet">
    <link rel="stylesheet" href="stylecss/index.css">
    <style>
        /* Adjust Quill editor height for better viewing in the modal */
        .ql-editor {
            min-height: 150px;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <h2 class="mb-4">Curriculum Management</h2>
    <button type="button" class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#curriculumModal" id="addNewBtn">
        Add New Curriculum
    </button>

    <table id="curriculumTable" class="table table-striped table-bordered" style="width:100%">
        <thead>
            <tr>
                <th class="battambang-bold tableID ">ID</th>
                <th class="battambang-bold tabltitle ">Title</th>
                <th class="battambang-bold tabltitle ">Title</th>
                <th class="battambang-bold tableimage ">Image</th>
                <th class="battambang-bold tablestatus">Status</th>
                <th class="battambang-bold tableaction">Actions</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>
</div>

<div class="modal fade" id="curriculumModal" tabindex="-1" aria-labelledby="curriculumModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form id="curriculumForm" enctype="multipart/form-data">
                <div class="modal-header">
                    <h5 class="modal-title" id="curriculumModalLabel">Create Curriculum</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="curriculum_id" name="id">
                    <input type="hidden" id="action" name="action" value="create">

                    <div class="mb-3">
                        <label for="title_En" class="form-label">Title (English)</label>
                        <input type="text" class="form-control" id="title_En" name="title_En" required>
                    </div>
                    <div class="mb-3">
                        <label for="title_KH" class="form-label">Title (Khmer)</label>
                        <input type="text" class="form-control" id="title_KH" name="title_KH" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Description (English)</label>
                        <div id="description_EN_editor" class="quill-editor"></div>
                        <input type="hidden" name="description_EN" id="description_EN_hidden">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Description (Khmer)</label>
                        <div id="description_KH_editor" class="quill-editor"></div>
                        <input type="hidden" name="description_KH" id="description_KH_hidden">
                    </div>

                    <div class="mb-3">
                        <label for="images" class="form-label">Images (File Upload)</label>
                        <input type="file" class="form-control" id="images" name="images" accept="image/*">
                        <div id="currentImageContainer" class="mt-2" style="display:none;">
                            Current Image: <img id="currentImage" src="" alt="Current Image" style="max-width: 100px; height: auto;">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-select" id="status" name="status" required>
                            <option value="1">Active</option>
                            <option value="0">Inactive</option>
                        </select>
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">Save changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/2.0.8/js/dataTables.js"></script>
    <script src="https://cdn.datatables.net/2.0.8/js/dataTables.bootstrap5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script> <!-- message toastr -->
    <script src="script/toastrmessage.js"></script>
<script>
    $(document).ready(function() {
    // --- API Configuration ---
    const API_URL = 'https://api.ontario.edu.kh/curriculum.php'; // **<-- CHANGE THIS TO YOUR ACTUAL API PATH**
    const quill_EN = new Quill('#description_EN_editor', {
        theme: 'snow'
    });
    const quill_KH = new Quill('#description_KH_editor', {
        theme: 'snow'
    });
    const table = $('#curriculumTable').DataTable({
        "processing": true,
        "serverSide": false, // Use client-side processing for this example
        "ajax": {
            "url": API_URL + '?action=read',
            "dataSrc": "data"
        },
        "columns": [
            { "data": "id", className: 'battambang-regular text-center',
                render: function (data, type, row, meta) {
                return meta.row +1; // Auto-incrementing value
            }},
            { "data": "title_En", className: 'battambang-regular' },
            { "data": "title_KH", className: 'battambang-regular' },
            {"data": "images", className: 'battambang-regular text-center' ,
                "render": function (data, type, row) {
                    if (data) {
                        return `<img src="https://api.ontario.edu.kh/${data}" alt="Banner Image" style="height: 50px; width:40px">`;
                    }
                    return '';
                }},
            { "data": "status", className: 'battambang-regular text-center', "render": function(data) {
                return data == '1' ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-secondary">Inactive</span>';
            }},
            { "data": null, "defaultContent": `
                <button class="btn btn-sm btn-warning edit-btn">Edit</button>
                <button class="btn btn-sm btn-danger delete-btn">Delete</button>
            `}
        ]
    });

    // --- Modal Reset on New Button Click ---
    $('#addNewBtn').on('click', function() {
        $('#curriculumModalLabel').text('Create Curriculum');
        $('#action').val('create');
        $('#curriculumForm')[0].reset();
        $('#curriculum_id').val('');
        quill_EN.setContents([]); // Clear Quill editor
        quill_KH.setContents([]);
        $('#currentImageContainer').hide();
        $('#images').prop('required', true); // Require image on create
    });
    
    // --- EDIT Button Click Handler ---
    $('#curriculumTable tbody').on('click', '.edit-btn', function () {
        const data = table.row($(this).parents('tr')).data();
        const curriculumId = data.id;

        // Fetch single record data
        $.get(API_URL + '?action=get_single&id=' + curriculumId, function(response) {
            $('#curriculumModalLabel').text('Update Curriculum');
            $('#action').val('update');
            $('#curriculum_id').val(response.id);
            $('#title_En').val(response.title_En);
            $('#title_KH').val(response.title_KH);
            $('#status').val(response.status);
            
            // Set Quill content
            quill_EN.root.innerHTML = response.description_EN;
            quill_KH.root.innerHTML = response.description_KH;

            // Handle image display and optional requirement
            $('#images').prop('required', false); // Not required for update
            if (response.images) {
                $('#currentImage').attr('src', response.images); // Assumes API returns full path
                $('#currentImageContainer').show();
            } else {
                $('#currentImageContainer').hide();
            }

            // Show modal
            $('#curriculumModal').modal('show');
        }).fail(function() {
            alert('Failed to fetch data for editing.');
        });
    });

    // --- DELETE Button Click Handler ---
    $('#curriculumTable tbody').on('click', '.delete-btn', function () {
        const data = table.row($(this).parents('tr')).data();
        const curriculumId = data.id;

        if (confirm('Are you sure you want to delete curriculum ID ' + curriculumId + '?')) {
            $.ajax({
                url: API_URL + '?action=delete&id=' + curriculumId,
                type: 'DELETE', // DELETE method is better REST practice
                success: function(response) {
                    alert(response.message);
                    table.ajax.reload(); // Reload DataTables
                },
                error: function(xhr) {
                    alert('Error deleting curriculum: ' + xhr.responseJSON.message);
                }
            });
        }
    });

    // --- Form Submission (CREATE and UPDATE) ---
    $('#curriculumForm').on('submit', function(e) {
        e.preventDefault();

        // 1. Get content from Quill Editors and set hidden inputs
        $('#description_EN_hidden').val(quill_EN.root.innerHTML);
        $('#description_KH_hidden').val(quill_KH.root.innerHTML);

        const formData = new FormData(this); // Use FormData for file uploads

        $.ajax({
            url: API_URL,
            type: 'POST',
            data: formData,
            contentType: false, // Required for FormData
            processData: false, // Required for FormData
            success: function(response) {
                 toastr.success('Welcome back to the system!', 'Login Successful');
                $('#curriculumModal').modal('hide');
                table.ajax.reload(); // Reload DataTables
            },
            error: function(xhr) {
                alert('Error processing request: ' + (xhr.responseJSON ? xhr.responseJSON.message : xhr.responseText));
            }
        });
    });

});
</script>

</body>
</html>
