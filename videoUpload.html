<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Manager | Bootstrap 5.3.3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/2.0.7/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link rel="stylesheet" href="stylecss/index.css">
    <link rel="stylesheet" href="stylecss/tablestyle.css">
    <style>
        .thumbnail-preview {
            max-width: 80px;
            height: auto;
        }
        .matop{
            margin-top: 20px;
        }
    </style>

</head>

<body>
    <div class="card matop">
        <div class="card-header">
            <div class="row align-items-center bg-light">
                <div class="col-md-8" style="vertical-align: baseline;margin: auto;">
                    <h2 class="mb-4">Video Management System</h2>

                </div>
                <div class="col-md-4" style="margin-top: 10px;">
                    <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#videoModal"
                        id="addNewBtn" style="vertical-align: baseline;margin: auto;float: right;">
                        <i class="bi bi-plus-circle-fill"></i>&nbsp; Add New Video
                    </button>
                </div>
            </div>
        </div>

        <div class="scrollable-body">
            <div class="card-body">
                <table id="videoTable" class="table table-striped table-hover" style="width:100%">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Description</th>
                            <th>Video URL</th>
                            <th>Thumbnail</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="videoModal" tabindex="-1" aria-labelledby="videoModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="videoForm" enctype="multipart/form-data">
                    <div class="modal-header">
                        <h5 class="modal-title" id="videoModalLabel">Add New Video</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" name="id" id="video_id">

                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" name="title" required>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="videoUrl" class="form-label">Video URL</label>
                            <input type="text" class="form-control" id="videoUrl" name="videoUrl" required>
                        </div>
                        <div class="mb-3">
                            <label for="thumbnail" class="form-label">Thumbnail</label>
                            <input type="file" class="form-control" id="thumbnail" name="thumbnail" accept="image/*">
                            <small class="form-text text-muted" id="currentThumbnail"></small>
                            <img src="" id="thumbnailPreview" class="mt-2 thumbnail-preview" style="display: none;">
                        </div>
                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status" name="status" required>
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>
                        <input type="hidden" name="created_by" id="created_by" value="1">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary" id="saveVideoBtn">Save changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/2.0.8/js/dataTables.js"></script>
    <script src="https://cdn.datatables.net/2.0.8/js/dataTables.bootstrap5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>

    <script>
        $(document).ready(function () {
            const API_URL = 'https://api.ontario.edu.kh/API/Videos/VideosCrud.php'; // *** CHANGE THIS if your file is named differently or in a subdir ***
            let videoTable;
            const thumbnailBasePath = 'https://api.ontario.edu.kh/API/Videos/'; // Base path for thumbnails (where api.php is)

            // Initialize DataTable
            videoTable = $('#videoTable').DataTable({
                "processing": true,
                "serverSide": false, // Use client-side processing for simplicity with this setup
                "ajax": {
                    "url": API_URL + '?action=get',
                    "type": "GET",
                    "dataSrc": "data" // Expecting { "data": [...] } from the API
                },
                "columns": [
                    { "data": "id" },
                    { "data": "title",
                        "render": function (data) {
                            // Display a truncated version of the description
                            return data.length > 20 ? data.substr(0, 20) + '...' : data;
                        }
                     },
                    { "data": "description",
                        "render": function (data) {
                            // Display a truncated version of the description
                            return data.length > 20 ? data.substr(0, 20) + '...' : data;
                        }
                     },
                    { "data": "videoUrl",
                        "render": function (data) {
                            // Display a truncated version of the description
                            return data.length > 20 ? data.substr(0, 20) + '...' : data;
                        }
                     },
                    { // Thumbnail column
                        "data": "thumbnail",
                        "render": function (data, type, row) {
                            return '<img src="' + thumbnailBasePath + data + '" class="thumbnail-preview">';
                        }
                    },
                    { "data": "status" },
                    { // Actions column
                        "data": null,
                        "render": function (data, type, row) {
                            return `<button class="btn btn-sm btn-info edit-btn" data-id="${row.id}">Edit</button>
                                <button class="btn btn-sm btn-danger delete-btn" data-id="${row.id}" data-title="${row.title}">Delete</button>`;
                        }
                    }
                ]
            });

            // --- Event Handlers ---

            // 1. Reset Modal on New Button Click
            $('#addNewBtn').on('click', function () {
                $('#videoForm')[0].reset();
                $('#video_id').val('');
                $('#videoModalLabel').text('Add New Video');
                $('#currentThumbnail').text('Required for new entry.');
                $('#thumbnail').prop('required', true); // Require thumbnail for new entry
                $('#thumbnailPreview').hide().attr('src', '');
            });

            // 2. Submit Form (Create/Update)
            $('#videoForm').on('submit', function (e) {
                e.preventDefault();

                const formData = new FormData(this);
                const isUpdate = $('#video_id').val() !== '';

                $.ajax({
                    url: API_URL,
                    type: 'POST', // Use POST for both CREATE and UPDATE with file uploads
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function (response) {
                        // alert(response.message);
                        $('#videoModal').modal('hide');
                        videoTable.ajax.reload(); // Reload DataTables
                    },
                    error: function (xhr, status, error) {
                        const response = xhr.responseJSON;
                        alert('Error: ' + (response ? response.message : 'Server error.'));
                    }
                });
            });

            // 3. Edit Button Click
            $('#videoTable').on('click', '.edit-btn', function () {
                const id = $(this).data('id');
                const data = videoTable.row($(this).parents('tr')).data();

                // Populate Modal Fields
                $('#video_id').val(data.id);
                $('#title').val(data.title);
                $('#description').val(data.description);
                $('#videoUrl').val(data.videoUrl);
                $('#status').val(data.status);
                $('#created_by').val(data.created_by);

                // Handle Thumbnail Display for Edit
                $('#thumbnail').prop('required', false); // Not required for update
                $('#currentThumbnail').html(`Current: <code>${data.thumbnail}</code> (Leave blank to keep current)`);
                $('#thumbnailPreview').show().attr('src', thumbnailBasePath + data.thumbnail);

                $('#videoModalLabel').text('Edit Video (ID: ' + id + ')');
                $('#videoModal').modal('show');
            });

            // 4. Delete Button Click
            $('#videoTable').on('click', '.delete-btn', function () {
                const id = $(this).data('id');
                const title = $(this).data('title');

                if (confirm(`Are you sure you want to delete the video: "${title}" (ID: ${id})?`)) {
                    $.ajax({
                        url: API_URL,
                        type: 'DELETE',
                        data: { id: id },
                        success: function (response) {
                            alert(response.message);
                            videoTable.ajax.reload();
                        },
                        error: function (xhr, status, error) {
                            const response = xhr.responseJSON;
                            alert('Error: ' + (response ? response.message : 'Server error.'));
                        }
                    });
                }
            });
        });
    </script>
</body>

</html>
