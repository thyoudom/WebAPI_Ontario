<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #f8f9fa;
        }

        #card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            /* Provides space between cards */
            justify-content: center;
        }

        .card-item {
            flex: 0 0 250px;
            /* Fixed width for each card */
            margin: 10px;
        }

        .card-img-top {
            height: 150px;
            object-fit: cover;
        }

        .card-behave {
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="container my-5">
        <h1 class="text-center mb-4">API-Powered Card Display</h1>
        <div id="card-container" class="row justify-content-center">
        </div>
    </div>
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        
        const cardContainer = document.getElementById('card-container');
        const API_URL = 'https://api.ontario.edu.kh/SliderAPI.php'; // Fetches 100 photos
        // Function to fetch data from the API and render cards
        const fetchAndRenderCards = async () => {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();

                data.forEach(item => {
                    const newCard = createCard(item);
                    cardContainer.appendChild(newCard);
                });

            } catch (error) {
                console.error('Could not fetch data:', error);
                // You could add a message to the user here
                cardContainer.innerHTML = '<p class="text-danger">Failed to load cards. Please try again later.</p>';
            }
        };
        // Function to create a single card element
        const createCard = (data) => {
            const cardCol = document.createElement('div');
            cardCol.className = 'col-sm-6 col-md-4 col-lg-3 d-flex justify-content-center card-behave';

            const card = document.createElement('div');
            card.className = 'card shadow-sm card-item';
            const ulr = 'https://api.ontario.edu.kh/Images/';
            const cardImg = document.createElement('img');
            cardImg.src = ulr + data.image_file;
            cardImg.className = 'card-img-top';
            cardImg.alt = data.name;

            const cardBody = document.createElement('div');
            cardBody.className = 'card-body';

            const cardTitle = document.createElement('h5');
            cardTitle.className = 'card-title';
            cardTitle.innerHTML = data.name;

            const cardText = document.createElement('p');
            cardText.className = 'card-text text-muted';
            cardText.textContent = `ID: ${data.id}`;

            // Append elements
            cardBody.appendChild(cardTitle);
            cardBody.appendChild(cardText);
            card.appendChild(cardImg);
            card.appendChild(cardBody);
            cardCol.appendChild(card);

            return cardCol;
        };
        // Call the function when the page loads
        document.addEventListener('DOMContentLoaded', fetchAndRenderCards);
    </script>
</body>

</html>
